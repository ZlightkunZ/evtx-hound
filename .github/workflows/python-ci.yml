name: Python Secure CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest pytest-cov bandit flake8 mypy
        
    - name: Static Type Checking (mypy)
      run: mypy triage.py
      
    - name: Linting (flake8)
      run: flake8 triage.py --count --select=E9,F63,F7,F82 --show-source --statistics
      
    - name: Security Scanning (Bandit)
      run: bandit -r triage.py -ll
      
    - name: Unit Tests & Coverage
      env:
        PYTHONPATH: .
      run: pytest tests/ -v
